[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "census-income-ml"
version = "0.1.0"
description = "Reproducible historical Census income research and model evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.5.4", "pandas==3.0.6", "scikit-learn==1.9.1", "scipy==1.18.1",
  "joblib==1.6.0",
  "streamlit==1.66.1", "plotly==7.1.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "nbformat==5.11.1", "nbclient==0.11.0", "nbconvert==7.17.2", "ipykernel==7.4.0", "psutil==7.2.2", "matplotlib==3.11.2", "seaborn==0.13.2"]

[project.scripts]
census-income-train = "census_income.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-ra -m "not workspace"'
markers = ["workspace: historical enclosing-workspace preservation audit; not part of portable checkout", "artifact: requires the project-generated fitted model and reports", "ui: Streamlit AppTest workflows"]
